interface:
  display_name: "Official Question Import"
  short_description: "初始化、对话写题、二元题标签压缩、批量改写现有批次、预校验、预览并安全提交官方题批次"
  default_prompt: "Use $official-question-import to initialize a workspace, turn conversation or stem-only Excel/CSV input into official-question batches, run the executable completion stage before import, auto-complete missing bilingual title, category, binary options, and time fields when the user only provides a Chinese or English stem, interpret all naive datetimes in America/New_York, generate concise symmetric yes/no labels for binary questions from question title plus raw resolution rule using the binary label generator prompt, pass them through the binary label review prompt before writing, rewrite existing batches in a more natural personal style when asked, preview diffs before overwriting any workbook, and only submit after confirmation. When submit needs ops-admin access, first ask for ops-admin email and password, exchange them for a token, and fall back to pasted Bearer token only if the user does not want to share a password."

policy:
  allow_implicit_invocation: true
